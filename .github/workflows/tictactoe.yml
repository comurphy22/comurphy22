name: tic tac toe move

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: startsWith(github.event.issue.title, 'move:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Play the move
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python3 scripts/play_move.py

      - name: Commit the updated board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game_state.json
          git diff --staged --quiet || git commit -m "tic-tac-toe: play ${{ github.event.issue.title }}"
          git push

      - name: Reply and close the issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Move played. Check the board on the profile README."
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
